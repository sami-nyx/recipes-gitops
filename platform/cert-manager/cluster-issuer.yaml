apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: saminsx@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-prod-key

    solvers:
      - dns01:
          webhook:
            groupName: acme.weaversls.com
            solverName: godaddy
            config:
              production: true

              apiKeySecretRef:
                name: godaddy-api-key-secret
                key: api-key
                secret: secret