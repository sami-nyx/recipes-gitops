apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
      argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    email: saminsx@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-prod-key

    solvers:
      # Native cert-manager Route53 support - no third-party webhook, no
      # API key secret. Auth is IRSA via the cert-manager ServiceAccount's
      # own eks.amazonaws.com/role-arn annotation (see
      # argocd/applications/platform/cert-manager.yaml), so no `role:`
      # field is needed here either.
      #
      # REPLACE_ME: the hosted zone ID from the manually-created Route53
      # zone (see readme.md's Route53 migration section) - ArgoCD applies
      # this file as-is, it can't fill this in for you.
      - dns01:
          route53:
            region: ap-south-1
            hostedZoneID: REPLACE_ME_ROUTE53_ZONE_ID