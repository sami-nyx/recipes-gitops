apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: godaddy-api-external-secret
  namespace: cert-manager
annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: godaddy-api-key-secret
    creationPolicy: Owner

  data:
    - secretKey: api-key       # Expected by the GoDaddy webhook config
      remoteRef:
        key: godaddy-api-credentials
        property: api-key

    - secretKey: secret    # Expected by the GoDaddy webhook config
      remoteRef:
        key: godaddy-api-credentials
        property: api-secret