apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: recipes-api-external-secret
  namespace: recipes
  labels:
    app: recipes-api
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1h" # How often ESO checks AWS Secrets Manager for updates
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: recipes-api-secret # Name of the target k8s Secret to create
    creationPolicy: Owner

  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: prod/recipes/api-keys
        property: JWT_SECRET_KEY

    - secretKey: SECRET_KEY
      remoteRef:
        key: prod/recipes/api-keys
        property: SECRET_KEY