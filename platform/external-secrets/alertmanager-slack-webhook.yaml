apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
  labels:
    app: alertmanager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner

  data:
    # A separate AWS secret from the SLACK_WEBHOOK_URL GitHub Actions
    # secret CI already uses - see recipes-aws-infra's cluster-roles
    # module for why (GitHub secrets aren't readable from inside the
    # cluster regardless, so this exists either way, kept independent
    # even though the value starts out identical).
    - secretKey: url
      remoteRef:
        key: recipes-alertmanager-slack-webhook
