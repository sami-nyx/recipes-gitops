apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: recipes-api-postgres
  labels:
    app.kubernetes.io/name: recipes-api-postgres
    app.kubernetes.io/instance: recipes-api

spec:
  instances: 1

  storage:
    size: 10Gi
    # storageClass: gp3

  bootstrap:
    initdb:
      database: recipes
      owner: recipes-api