apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: recipes-root
  namespace: argocd

spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/recipes-cluster-resources.git'
    targetRevision: HEAD
    path: argocd/applications
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=true