apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipes-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sami-nyx/recipes-gitops.git
    targetRevision: HEAD
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true