apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudfront-sync
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.roleArn | quote }}
    # Must exist before the sync-job pre-install/pre-upgrade hook Job runs
    # (it's the Job's serviceAccountName), so hook it in at a lower weight
    # than that Job - same reasoning as recipes-api's configmap.yaml.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
