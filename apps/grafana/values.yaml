grafana:
  persistence:
    enabled: false

  # Watch for ConfigMaps labeled grafana_dashboard=1 in this namespace (see
  # templates/dashboard-configmap.yaml) and load them into Grafana automatically.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Default is /tmp/dashboards - matched below by default_home_dashboard_path.

  # Show our custom recipes-api dashboard (sidecar-provisioned above, into
  # sidecar.dashboards.folder) when a user opens Grafana with no dashboard
  # selected, instead of Grafana's built-in blank home page.
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/recipes-api-dashboard.json

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      eks-prometheus:
        gnetId: 1860
        revision: 45
        datasource: Prometheus

  # Provision datasources for Prometheus and Loki
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          isDefault: false
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.logging.svc.cluster.local:3100
          isDefault: true
