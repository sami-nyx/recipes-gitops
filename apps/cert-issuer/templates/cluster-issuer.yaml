apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    email: {{ .Values.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-prod-key

    solvers:
      # Native cert-manager Route53 support - no third-party webhook, no
      # API key secret. Auth is IRSA via the cert-manager ServiceAccount's
      # own eks.amazonaws.com/role-arn annotation (see
      # argocd/applications/platform/cert-manager.yaml), so no `role:`
      # field is needed here either.
      - dns01:
          route53:
            region: {{ .Values.region | quote }}
            hostedZoneID: {{ .Values.route53ZoneId | quote }}
