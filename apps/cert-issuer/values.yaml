# All three values below are kept in sync automatically by
# recipes-aws-infra's tf-apply-eks.yaml (sync-cert-issuer-config job) -
# it writes straight to this file on every terraform apply, sourced
# from that repo's EMAIL/REGION/ROUTE53_ZONE_ID variables and its own
# Terraform output for the role ARN below. Deliberate, not accidental:
# none of these are sensitive (see readme.md) - they're resource
# identifiers, not credentials - so committing the real values here
# and letting Argo CD sync normally beat every alternative that kept
# them out of git (an ignoreDifferences carve-out, a live kubectl
# patch) without needing a human to retype them every apply cycle.
# Editing them by hand still works fine; they'll just get overwritten
# on the next apply if they drift from recipes-aws-infra's variables.

# ACME account email - Let's Encrypt sends expiry/account notices here.
email: saminsx@gmail.com
# AWS region the Route53 hosted zone lives in.
region: ap-south-1
# The hosted zone ID cert-manager's Route53 DNS-01 solver is scoped to.
# Not known until the zone is created manually - see readme.md's
# "DNS: GoDaddy → Route53" section.
route53ZoneId: Z00700216ES7TD79SWYD
