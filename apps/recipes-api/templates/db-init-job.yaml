apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.recipesApi.name }}-db-init
  labels:
    app: {{ .Values.recipesApi.name }}
  annotations:
    # Ensure this runs before the deployment is created/updated during Helm syncs
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app: {{ .Values.recipesApi.name }}-db-init

    spec:
      restartPolicy: Never

      # ============================================================
      # Wait for PostgreSQL (Using nc like your deployment for reliability)
      # ============================================================

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z -w 2 {{ .Release.Name }}-postgres-rw 5432; do
                echo "Postgres is not ready yet... sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is reachable!"

      # ============================================================
      # Initialize Database
      # ============================================================

      containers:
        - name: init-db
          image: "{{ .Values.recipesApi.imageName }}:{{ .Values.recipesApi.imageTag }}"
          imagePullPolicy: {{ .Values.recipesApi.imagePullPolicy }}

          command:
            - python
            - -c
            - |
              from app import create_app
              from models.user import db

              app = create_app()

              with app.app_context():
                  db.create_all()

              print("Database initialization completed successfully")

          # ========================================================
          # Application Configuration
          # ========================================================

          envFrom:
            - configMapRef:
                name: {{ .Values.recipesApi.name }}-config

            - secretRef:
                name: recipes-api-secret

          # ========================================================
          # CNPG Database Credentials
          # ========================================================

          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: dbname

            - name: DB_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: password

          # ========================================================
          # Resources
          # ========================================================

          resources:
            {{- toYaml .Values.recipesApi.resources | nindent 12 }}