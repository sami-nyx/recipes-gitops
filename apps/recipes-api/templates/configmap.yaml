apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.recipesApi.name }}-config
  labels:
    app: {{ .Values.recipesApi.name }}

data:
  # ============================================================
  # Application
  # ============================================================

  FLASK_ENV: {{ .Values.recipesApi.flaskEnv | quote }}

  PORT: {{ .Values.recipesApi.port | quote }}

  APP_VERSION: {{ .Values.recipesApi.appVersion | quote }}

  CORS_ORIGIN: {{ .Values.recipesApi.corsOrigin | quote }}


  # ============================================================
  # Database
  # ============================================================

  DB_SCHEME: {{ .Values.recipesApi.dbScheme | quote }}

  DB_HOST: {{ .Values.recipesApi.dbHost | quote }}

  DB_PORT: {{ .Values.recipesApi.dbPort | quote }}