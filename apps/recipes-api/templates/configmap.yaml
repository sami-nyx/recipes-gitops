apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.recipesApi.name }}-config
  labels:
    app: {{ .Values.recipesApi.name }}
  annotations:
    # Must exist before the db-init pre-install/pre-upgrade hook Job runs
    # (it's envFrom'd there), so hook it in at a lower weight than that Job.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation

data:
  # ============================================================
  # Application
  # ============================================================

  FLASK_ENV: {{ .Values.recipesApi.flaskEnv | quote }}

  PORT: {{ .Values.recipesApi.port | quote }}

  APP_VERSION: {{ .Values.recipesApi.appVersion | quote }}

  CORS_ORIGIN: {{ .Values.recipesApi.corsOrigin | quote }}


  # ============================================================
  # Database
  # ============================================================

  DB_SCHEME: {{ .Values.recipesApi.dbScheme | quote }}

  DB_HOST: {{ .Values.recipesApi.dbHost | default (printf "%s-postgres-rw" .Release.Name) | quote }}

  DB_PORT: {{ .Values.recipesApi.dbPort | quote }}