apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.recipesApi.name }}
  labels:
    app: {{ .Values.recipesApi.name }}
data:
  FLASK_ENV: {{ .Values.recipesApi.flaskEnv | quote }}
  DB_HOST: {{ default (printf "%s-postgres-rw" .Release.Name) .Values.recipesApi.dbHost | quote }}
  DB_PORT: {{ .Values.recipesApi.dbPort | quote }}