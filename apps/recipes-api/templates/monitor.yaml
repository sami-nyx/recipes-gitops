apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "recipes-api.fullname" . }}-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
    {{- include "recipes-api.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
      app: recipes-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s