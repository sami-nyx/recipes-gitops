apiVersion: apps/v1
kind: Deployment
metadata:
   name: {{ .Values.recipesApi.name }}
  labels:
    app: {{ .Values.recipesApi.name }}
spec:
  replicas: {{ .Values.recipesApi.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.recipesApi.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.recipesApi.name }}
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL to be ready..."
            # CNPG creates a read-write service named: <cluster-name>-rw
            until nc -z -w 2 {{ .Release.Name }}-postgres-rw 5432; do
              echo "Postgres is not ready yet... sleeping 2s"
              sleep 2
            done
            echo "PostgreSQL is reachable!"
      containers:
      - name: {{ .Values.recipesApi.name }}
        image: "{{ .Values.recipesApi.imageName }}:{{ .Values.recipesApi.imageTag }}"
        imagePullPolicy: {{ .Values.recipesApi.imagePullPolicy }}

        ports:
        - containerPort: {{ .Values.recipesApi.port }}
          name: http

        # --- ENVIRONMENT VARIABLES ---
        # 1. Bulk-load ConfigMap & Application Secrets
        envFrom:
        - configMapRef:
            name: {{ .Values.recipesApi.name }}-config
        - secretRef:
            name: recipes-api-secret
            # name: {{ .Values.recipesApi.name }}-secret

        # 2. Map CNPG Auto-Generated Database Credentials
        env:
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: dbname
        - name: DB_USER_NAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: password
        # --- HEALTHCHECKS ---
        readinessProbe:
          httpGet:
            path: /system/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /system/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        # --- RESOURCE ALLOCATION ---
        resources:
          {{- toYaml .Values.recipesApi.resources | nindent 10 }}