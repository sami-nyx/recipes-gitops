apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.recipesApi.name }}-secret
  labels:
    app: recipes-api
  annotations:
    # Must exist before the db-init pre-install/pre-upgrade hook Job runs
    # (it's envFrom'd there), so hook it in at a lower weight than that Job.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque