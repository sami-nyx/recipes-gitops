apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cluster-secrets
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sami-nyx/recipes-gitops.git
    targetRevision: main
    path: platform/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: recipes

  syncPolicy:
    syncOptions:
      - CreateNamespace=true