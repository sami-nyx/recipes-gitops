apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: recipes-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io


spec:
  project: default

  source:
    repoURL: https://github.com/sami-nyx/recipes-gitops.git
    targetRevision: main
    path: platform/postgres

  destination:
    server: https://kubernetes.default.svc
    namespace: recipes

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
