apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    # Was previously a stray top-level metadata key (not under
    # `annotations:`), so Argo CD never actually applied a sync-wave here.
    argocd.argoproj.io/sync-wave: "0"

  finalizers:
    - resources-finalizer.argocd.argoproj.io


spec:
  project: default

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.0

    helm:
      values: |
        serviceAccount:
          create: true
          name: fluent-bit-service-account

        config:
          inputs: |
            [INPUT]
                Name             tail
                Tag              kube.*
                Path             /var/log/containers/*.log
                Parser           cri
                DB               /var/log/fluentbit_kube.db
                Mem_Buf_Limit    10MB
                Skip_Long_Lines  On
                Refresh_Interval 10

          outputs: |
            [OUTPUT]
                Name            loki
                Match           kube.*
                Host            loki.logging.svc.cluster.local
                Port            3100
                URI             /loki/api/v1/push
                Labels           namespace=$kubernetes['namespace_name'], app=$kubernetes['labels']['app'], component=$kubernetes['container_name']

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
