apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.9.0
    helm:
      values: |
        deploymentMode: Monolithic

        # Disable built-in memory caches to fit comfortably on t3a.medium nodes
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # Configure service account for AWS IRSA
        serviceAccount:
          create: true
          name: loki-service-account
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::889867978066:role/loki-s3-role-production"

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          
          # Schema Configuration for TSDB and S3
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          # S3 Object Storage Configuration
          storage:
            type: s3
            bucketNames:
              chunks: recipes-app-loki-logs-production
              ruler: recipes-app-loki-logs-production
              admin: recipes-app-loki-logs-production
            s3:
              endpoint: s3.ap-south-1.amazonaws.com
              region: ap-south-1
              s3ForcePathStyle: false

        singleBinary:
          replicas: 1
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true