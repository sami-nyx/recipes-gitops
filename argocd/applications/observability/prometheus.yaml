apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io


spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack 
    targetRevision:  88.3.0  
    helm:
      releaseName: prometheus
      values: |
        alertmanager:
          alertmanagerSpec:
            # Mounts platform/external-secrets/alertmanager-slack-webhook.yaml's
            # K8s Secret into /etc/alertmanager/secrets/alertmanager-slack-webhook/ -
            # api_url_file below reads the webhook URL from there directly,
            # so it never appears in this values block or in Alertmanager's
            # own rendered config.
            secrets:
              - alertmanager-slack-webhook

          config:
            global:
              resolve_timeout: 5m

            # Unchanged from the chart's own defaults - suppress a firing
            # warning/info for the same alert+namespace once its critical
            # counterpart is already firing, and don't let the synthetic
            # always-on Watchdog alert (below) trigger InfoInhibitor noise.
            inhibit_rules:
              - source_matchers: ['severity = critical']
                target_matchers: ['severity =~ warning|info']
                equal: ['namespace', 'alertname']
              - source_matchers: ['severity = warning']
                target_matchers: ['severity = info']
                equal: ['namespace', 'alertname']
              - source_matchers: ['alertname = InfoInhibitor']
                target_matchers: ['severity = info']
                equal: ['namespace']
              - target_matchers: ['alertname = InfoInhibitor']

            route:
              group_by: ['namespace', 'alertname']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: 'slack'
              routes:
                # Watchdog is a synthetic alert the chart ships that's
                # *always* firing - it exists to prove the alerting
                # pipeline itself is alive (for an external dead-man's-switch
                # style check), not something to post to Slack every
                # repeat_interval forever.
                - receiver: 'null'
                  matchers:
                    - alertname = "Watchdog"

            receivers:
              - name: 'null'
              - name: 'slack'
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
                    send_resolved: true
                    title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
                    text: >-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}

            templates:
              - '/etc/alertmanager/config/*.tmpl'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true