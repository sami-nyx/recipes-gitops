apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.10.4
    helm:
      values: |
        persistence:
          enabled: false

        # Automatically provision dashboards
        dashboards:
          default:
            eks-prometheus:
              gnetId: 1860
              revision: 45
              datasource: Prometheus

        # Provision datasources for Prometheus and Loki
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local
                isDefault: false
              - name: Loki
                type: loki
                access: proxy
                url: http://loki.logging.svc.cluster.local:3100
                isDefault: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true