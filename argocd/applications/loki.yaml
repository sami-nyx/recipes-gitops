apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # Core infrastructure wave
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.9.0
    helm:
      values: |
        deploymentMode: Monolithic
        
        # Configure service account for AWS IRSA
        serviceAccount:
          create: true
          name: loki-service-account
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::889867978066:role/loki-s3-role-production"

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          
          # S3 Object Storage Configuration
          storage:
            type: s3
            s3:
              endpoint: s3.us-east-1.amazonaws.com
              region: us-east-1
              bucketNames:
                chunks: recipes-app-loki-logs-production
                ruler: recipes-app-loki-logs-production
                admin: recipes-app-loki-logs-production
              s3ForcePathStyle: false

        singleBinary:
          replicas: 1
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      self-heal: true
    syncOptions:
      - CreateNamespace=true