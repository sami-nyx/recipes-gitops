apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.21.0

    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true

        # IRSA for the Route53 DNS-01 solver (see
        # platform/cert-manager/cluster-issuer.yaml) - replaces the
        # GoDaddy webhook's API-key secret entirely.
        # REPLACE_ME: the cert_manager_route53_role_arn output from the
        # recipes-aws-infra Terraform apply - same as the zone ID next to
        # it, ArgoCD applies this file as-is and can't fill this in.
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: REPLACE_ME_CERT_MANAGER_ROUTE53_ROLE_ARN

        # Off by default in the chart - without this, cert-manager
        # exposes metrics (port 9402) but nothing scrapes them.
        # `labels.release: prometheus` is required for the
        # kube-prometheus-stack Prometheus CR to pick the ServiceMonitor
        # up at all (its serviceMonitorSelector matches on that label).
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
            labels:
              release: prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
