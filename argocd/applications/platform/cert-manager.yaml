apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.21.0
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
        # IRSA for the Route53 DNS-01 solver (see
        # apps/cert-issuer/templates/cluster-issuer.yaml) - replaces the
        # GoDaddy webhook's API-key secret entirely.
        # Kept in sync automatically by recipes-aws-infra's
        # tf-apply-eks.yaml (sync-cert-issuer-config job) - it writes
        # this value straight from its own Terraform output on every
        # apply (the role ARN gets a new random IAM name_prefix suffix
        # each time), the same way it keeps apps/cert-issuer/values.yaml
        # current. Not sensitive data - see that file's own comment for
        # why committing the real value here beats the alternatives.
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::889867978066:role/sami-recipes-app-cert-manager-route53-f0b172af2cd5cd9b13bae909ca
        # Off by default in the chart - without this, cert-manager
        # exposes metrics (port 9402) but nothing scrapes them.
        # `labels.release: prometheus` is required for the
        # kube-prometheus-stack Prometheus CR to pick the ServiceMonitor
        # up at all (its serviceMonitorSelector matches on that label).
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
            labels:
              release: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
