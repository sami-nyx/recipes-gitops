apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cert-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/sami-nyx/recipes-gitops.git
    targetRevision: main
    path: platform/cert-manager

  destination:
    server: https://kubernetes.default.svc


  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
