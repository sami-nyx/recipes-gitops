apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-godaddy-webhook
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://fred78290.github.io/cert-manager-webhook-godaddy/
    chart: godaddy-webhook
    targetRevision: 1.29

    helm:
      releaseName: godaddy-webhook
      values: |
        groupName: acme.weaversls.com

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true