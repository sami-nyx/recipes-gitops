apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.recipesApi.name }}-secret
  namespace: {{ .Values.recipesApi.namespace }}
  labels:
    app: {{ .Values.recipesApi.name }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.recipesApi.secrets.secretKey | quote }}
  JWT_SECRET_KEY: {{ .Values.recipesApi.secrets.jwtSecretKey | quote }}